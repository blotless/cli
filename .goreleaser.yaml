version: 2

project_name: blotless

builds:
  - id: blotless
    main: ./cmd/blotless
    binary: blotless
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/blotless/cli.Version={{.Version}}
      - -X github.com/blotless/cli.Commit={{.ShortCommit}}
      - -X github.com/blotless/cli.BuildDate={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
